name: pytest

on:
  push:
    branches: [cwbi-prod]
    paths:
      - .github/workflows/cwbi-prod-pytests.yml
      - '**.py'
  pull_request:
    branches: ['cwbi-prod']
    paths:
      - .github/workflows/cwbi-prod-pytests.yml
      - '**.py'

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker Build and Run; Test DAGS
        run: ./tests.sh
